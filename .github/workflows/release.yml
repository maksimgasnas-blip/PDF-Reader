name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-pkgconf
            mingw-w64-i686-zlib
            mingw-w64-i686-binutils
            mingw-w64-i686-crt-git
            mingw-w64-i686-headers-git
            mingw-w64-i686-winpthreads-git
            mingw-w64-i686-tools-git
            make
            patch
            python
            git
            curl
            tar
            zip
            unzip

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build MuPDF and PDF Studio
        run: |
          cd native
          ./fetch-mupdf.sh
          ./build.sh

      - name: Create source bundle for AGPL compliance
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP "PDF-Studio-source-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force $sourceDir | Out-Null
          git archive --format=tar HEAD | tar -xf - -C $sourceDir
          Copy-Item README.md,LICENSE,THIRD-PARTY.md (Join-Path $sourceDir '.') -Force
          Copy-Item native\fetch-mupdf.sh,native\build.sh (Join-Path $sourceDir 'native') -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'native\mupdf.tar.gz') (Join-Path $sourceDir 'mupdf-1.24.9-source.tar.gz')
          New-Item -ItemType Directory -Force dist | Out-Null
          $sourceZip = Join-Path $env:GITHUB_WORKSPACE "dist\PDF-Studio-source-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$sourceDir\*" -DestinationPath $sourceZip -CompressionLevel NoCompression -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'native\mupdf.tar.gz') (Join-Path $env:GITHUB_WORKSPACE 'dist\mupdf-1.24.9-source.tar.gz')

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $Matches[1] } else { '1.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\PDF-Studio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Run installer install/uninstall smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\PDF-Studio-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer output missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'PDFStudioSmoke'
          $p = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=pdfassoc', "/DIR=$installDir") -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Installer timed out' }
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'PDF-Studio.exe'))) { throw 'Installed app is missing' }
          if (-not (Test-Path (Join-Path $installDir 'THIRD-PARTY.md'))) { throw 'Third-party notices missing' }
          if (-not (Test-Path 'HKCU:\Software\Classes\PDFStudio.Document')) { throw 'Open With registration missing' }
          if (-not (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*.lnk' -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'PDF*' })) { throw 'Start menu shortcut missing' }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Uninstaller timed out' }
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
          if (Test-Path $installDir) { throw 'Install directory still exists after uninstall' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Windows
          path: |
            dist/PDF-Studio-Setup-*.exe
            dist/*.zip
            dist/mupdf-1.24.9-source.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PDF-Studio-Setup-*.exe
            dist/PDF-Studio-source-*.zip
            dist/mupdf-1.24.9-source.tar.gz
